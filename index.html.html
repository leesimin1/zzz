<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf7ff"><title>POLAR HOME · 터치 데모</title>
<style>
:root{--navy:#17365e;--blue:#1687e8;--green:#1bb77a;--muted:#68819b;--line:#dfedf6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eaf6fd;color:var(--navy);font-family:system-ui,-apple-system,'Apple SD Gothic Neo','Nanum Gothic',sans-serif}.app{max-width:460px;min-height:100vh;margin:auto;background:linear-gradient(180deg,#e5f6ff 0,#f8fcff 53%);position:relative;padding:18px 22px 96px;overflow:hidden}.brand{text-align:center;font-weight:950;font-size:21px;letter-spacing:-.6px;padding:8px}.brand span{color:var(--blue)}.tag{text-align:center;color:#547696;font-size:13px}.mascot{height:178px;display:flex;align-items:center;justify-content:center;position:relative}.mascot:before{content:"";position:absolute;width:210px;height:90px;bottom:9px;border-radius:50%;background:linear-gradient(180deg,#fff,#bdeaff);box-shadow:0 10px 24px #94cce433}.bear{position:relative;font-size:106px;filter:drop-shadow(0 9px 3px #9bc9db66);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-6px)}}.spark{position:absolute;color:#fff;font-size:22px}.s1{left:19%;top:36px}.s2{right:18%;top:25px}.card{background:#fff;border:1px solid #e5eff6;border-radius:24px;padding:22px 20px;box-shadow:0 15px 35px #195a8020}.card h1{font-size:23px;margin:0 0 5px;letter-spacing:-.5px}.sub{margin:0 0 19px;color:var(--muted);font-size:13px}.field{margin:13px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}.input-wrap{position:relative}.field input{width:100%;height:49px;border:1px solid #dbe8f2;border-radius:13px;background:#fbfdff;padding:0 42px 0 13px;font-size:14px;color:var(--navy);outline:none}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1687e81a}.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#7f96ab;padding:6px;cursor:pointer;font-size:17px}.btn{width:100%;height:50px;border:0;border-radius:14px;background:linear-gradient(90deg,#18b979,#24c889);color:white;font-size:15px;font-weight:800;margin-top:8px;cursor:pointer;box-shadow:0 6px 13px #1bb77a30;transition:transform .12s,filter .12s}.btn:active,.link:active,.nav button:active{transform:scale(.98);filter:brightness(.95)}.switch{text-align:center;margin:17px 0 0;font-size:13px;color:var(--muted)}.link{border:0;background:none;color:var(--blue);font-weight:800;padding:8px;cursor:pointer;font-size:13px}.note{min-height:18px;font-size:12px;color:#c44253;margin:12px 1px 0;line-height:1.45}.note.ok{color:#16845b}.fine{text-align:center;color:#8ba0b3;font-size:11px;line-height:1.5;margin:15px 12px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);height:72px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);z-index:2}.bottom button{border:0;background:none;color:#91a4b7;font-size:10px;cursor:pointer;min-width:55px}.bottom button span{display:block;font-size:20px;margin-bottom:3px}.bottom button.active{color:var(--green);font-weight:800}.welcome{display:none;text-align:center}.welcome .big{font-size:85px;margin:12px}.welcome h1{font-size:23px}.welcome p{color:var(--muted);font-size:14px;line-height:1.6}.welcome .btn{margin-top:14px}.hint{text-align:center;color:#8298ac;font-size:11px;margin:12px 0 0}.splash{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#fff 0,#e9f8ff 42%,#cdeeff 100%);transition:opacity .55s ease,visibility .55s ease}.splash.hide{opacity:0;visibility:hidden;pointer-events:none}.splash-logo{font-size:28px;font-weight:950;letter-spacing:-1px;opacity:0;animation:rise .65s .12s ease-out forwards}.splash-logo span{color:var(--blue)}.splash-tag{font-size:13px;color:#547696;margin-top:5px;opacity:0;animation:rise .55s .35s ease-out forwards}.splash-bear{font-size:116px;margin:17px 0 12px;filter:drop-shadow(0 13px 7px #6ea9c955);opacity:0;animation:bear-in .8s .25s cubic-bezier(.2,.8,.2,1) forwards, float 2.8s 1.05s ease-in-out infinite}.splash-ice{width:235px;height:38px;margin-top:-12px;border-radius:50%;background:linear-gradient(180deg,#fff,#a9e5ff);box-shadow:0 10px 25px #68b6d844;opacity:0;animation:rise .6s .5s ease-out forwards}.splash-loading{width:128px;height:4px;background:#c8e8f7;border-radius:5px;margin-top:35px;overflow:hidden;opacity:0;animation:rise .4s .55s ease forwards}.splash-loading:after{content:"";display:block;height:100%;width:40%;background:var(--green);border-radius:5px;animation:load 1.05s .55s ease-in-out infinite}.snow{position:absolute;top:-25px;color:#fff;font-size:19px;animation:fall 3.5s linear infinite;opacity:.8}.snow.a{left:17%;animation-delay:.1s}.snow.b{left:78%;font-size:14px;animation-delay:.9s}.snow.c{left:61%;font-size:23px;animation-delay:1.5s}.splash-skip{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));border:0;background:#ffffff88;color:#66809c;border-radius:20px;padding:8px 15px;font-size:12px;cursor:pointer;opacity:0;animation:rise .4s .8s ease forwards}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes bear-in{0%{opacity:0;transform:translateY(28px) scale(.72)}70%{opacity:1;transform:translateY(-5px) scale(1.06)}100%{opacity:1;transform:translateY(0) scale(1)}}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}@keyframes fall{0%{transform:translateY(-5vh) rotate(0)}100%{transform:translateY(110vh) rotate(260deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body><div class="splash" id="splash" role="button" tabindex="0" aria-label="시작 화면, 누르면 건너뛰기"><span class="snow a">❄</span><span class="snow b">✦</span><span class="snow c">❄</span><div class="splash-logo">POLAR <span>HOME</span></div><div class="splash-tag">작은 절약이 북극곰의 집을 지켜요</div><div class="splash-bear">🐻‍❄️</div><div class="splash-ice"></div><div class="splash-loading"></div><button class="splash-skip" id="skipSplash" type="button">화면을 눌러 시작하기</button></div><main class="app"><div class="brand">POLAR <span>HOME</span></div><div class="tag">함께 지구를 지켜요 🌱</div><section id="auth"><div class="mascot"><i class="spark s1">✦</i><i class="spark s2">❄</i><div class="bear">🐻‍❄️</div></div><div class="card"><h1 id="title">다시 만나 반가워요!</h1><p class="sub" id="subtitle">오늘도 함께 절약해요.</p><form id="form" novalidate><div class="field" id="nameField" hidden><label for="name">이름</label><input id="name" autocomplete="name" placeholder="이름을 입력해 주세요" maxlength="40"></div><div class="field"><label for="email">이메일</label><div class="input-wrap"><input id="email" type="email" autocomplete="email" placeholder="name@example.com" maxlength="254" required></div></div><div class="field"><label for="password">비밀번호</label><div class="input-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호를 입력해 주세요" minlength="10" maxlength="128" required><button class="eye" id="eye" type="button" aria-label="비밀번호 표시">◉</button></div></div><button class="btn" id="submit" type="submit">로그인</button><div id="message" class="note" role="status" aria-live="polite"></div></form><p class="switch"><span id="switchText">아직 계정이 없나요?</span> <button class="link" id="switch" type="button">회원가입</button></p></div><p class="fine">작은 절약이 북극곰의 집을 지켜요.<br>화면을 눌러 로그인·회원가입 데모를 체험해 보세요.</p></section><section class="welcome" id="welcome"><div class="mascot"><div class="bear">🐻‍❄️</div></div><div class="card"><h1 id="welcomeTitle">환영해요!</h1><p>로그인 화면 데모가 작동했어요.<br>실제 계정 인증은 서버 연결이 필요합니다.</p><button id="again" class="btn">로그인 화면으로</button></div></section></main><nav class="bottom" aria-label="하단 메뉴"><button class="active" type="button" data-label="홈"><span>⌂</span>홈</button><button type="button" data-label="전기요금"><span>ϟ</span>전기요금</button><button type="button" data-label="북극곰"><span>🐾</span>북극곰</button><button type="button" data-label="미션"><span>♧</span>미션</button><button type="button" data-label="마이페이지"><span>♙</span>마이페이지</button></nav>
<script>
(()=>{let signup=false;const $=id=>document.getElementById(id);const splash=$('splash');let splashTimer;function closeSplash(){if(splash.classList.contains('hide'))return;splash.classList.add('hide');clearTimeout(splashTimer);setTimeout(()=>splash.remove(),650)}splashTimer=setTimeout(closeSplash,2300);$('skipSplash').addEventListener('click',e=>{e.stopPropagation();closeSplash()});splash.addEventListener('click',closeSplash);splash.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();closeSplash()}});const auth=$('auth'),welcome=$('welcome'),nameField=$('nameField'),name=$('name'),email=$('email'),password=$('password'),msg=$('message');function mode(next){signup=next;$('title').textContent=signup?'계정 만들기':'다시 만나 반가워요!';$('subtitle').textContent=signup?'가입하고 절약을 시작해요.':'오늘도 함께 절약해요.';$('submit').textContent=signup?'회원가입':'로그인';$('switchText').textContent=signup?'이미 계정이 있나요?':'아직 계정이 없나요?';$('switch').textContent=signup?'로그인':'회원가입';nameField.hidden=!signup;password.autocomplete=signup?'new-password':'current-password';password.placeholder=signup?'10자 이상 입력해 주세요':'비밀번호를 입력해 주세요';msg.textContent='';msg.className='note'}$('switch').addEventListener('click',()=>mode(!signup));$('eye').addEventListener('click',()=>{password.type=password.type==='password'?'text':'password';$('eye').textContent=password.type==='password'?'◉':'◎'});$('form').addEventListener('submit',e=>{e.preventDefault();const evalue=email.value.trim();if(signup&&!name.value.trim()){msg.textContent='이름을 입력해 주세요.';name.focus();return}if(!evalue||!email.checkValidity()){msg.textContent='올바른 이메일 주소를 입력해 주세요.';email.focus();return}if(password.value.length<(signup?10:1)){msg.textContent=signup?'비밀번호를 10자 이상 입력해 주세요.':'비밀번호를 입력해 주세요.';password.focus();return}if(signup){msg.textContent='회원가입 화면 체험 완료!';msg.className='note ok';$('welcomeTitle').textContent='환영해요, '+name.value.trim()+'님!'}else{$('welcomeTitle').textContent='로그인 화면 체험 완료!'}auth.style.display='none';welcome.style.display='block'});$('again').addEventListener('click',()=>{welcome.style.display='none';auth.style.display='block';mode(false);$('form').reset()});document.querySelectorAll('.bottom button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.label!=='홈'){msg.textContent=b.dataset.label+' 화면은 앱 연결 후 이용할 수 있어요.';msg.className='note'}}));})();
</script></body></html>
