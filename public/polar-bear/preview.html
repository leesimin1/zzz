<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>폴라의 다양한 모습 | POLAR HOME</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f1f8fc;
        color: #17365e;
        font-family: Arial, 'Malgun Gothic', sans-serif;
      }
      header,
      main {
        width: min(1100px, 100%);
        margin: 0 auto;
        padding: 24px;
      }
      header a {
        color: #047857;
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        font-weight: 700;
      }
      h1 {
        margin: 16px 0 12px;
        font-size: clamp(28px, 4vw, 42px);
        letter-spacing: -1px;
      }
      header p {
        color: #526c85;
        line-height: 1.8;
        margin: 0;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 1.15fr;
        gap: 24px;
        padding-top: 4px;
      }
      .stage {
        align-self: start;
        position: sticky;
        top: 24px;
        border: 1px solid #dceef8;
        border-radius: 32px;
        padding: 24px;
        text-align: center;
        background: linear-gradient(150deg, #c9efff, #f8fdff 65%, #e2f9ee);
      }
      .stage img {
        width: 100%;
        height: min(48vh, 400px);
        object-fit: contain;
        animation: breathe 3s ease-in-out infinite;
      }
      .stage h2 {
        margin: 12px 0 8px;
        font-size: 24px;
      }
      .stage p {
        color: #526c85;
        margin: 0 0 20px;
      }
      .download {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        border-radius: 16px;
        background: #047857;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .pose {
        min-width: 0;
        padding: 12px;
        background: #fff;
        border: 2px solid #e1edf5;
        border-radius: 24px;
        color: #17365e;
        cursor: pointer;
        font: inherit;
        text-align: center;
      }
      .pose:hover {
        border-color: #71c4ac;
      }
      .pose[aria-pressed='true'] {
        border-color: #047857;
        background: #effbf5;
      }
      .pose img {
        display: block;
        width: 100%;
        height: 130px;
        object-fit: contain;
      }
      .pose strong {
        display: block;
        margin: 8px 0;
        font-size: 16px;
      }
      .pose small {
        display: block;
        color: #526c85;
        line-height: 1.5;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #1751d0;
        outline-offset: 4px;
      }
      #status {
        font-size: 14px;
        line-height: 1.6;
        color: #526c85;
      }
      @keyframes breathe {
        50% {
          transform: translateY(-5px);
        }
      }
      @media (max-width: 700px) {
        header,
        main {
          padding: 18px;
        }
        main {
          grid-template-columns: 1fr;
        }
        .stage {
          position: static;
        }
        .stage img {
          height: 260px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">← POLAR HOME</a>
      <h1>같은 폴라, 다양한 하루.</h1>
      <p>
        초록 목도리 북극곰의 8가지 포즈와 표정이에요.<br />원하는 모습을 누르면
        크게 보고 개별 PNG로 내려받을 수 있어요.
      </p>
    </header>
    <main>
      <section class="stage" aria-label="선택한 북극곰">
        <img
          id="selected-image"
          src="idle.png"
          alt="기본 자세의 북극곰"
          width="1254"
          height="1254"
        />
        <div aria-live="polite">
          <h2 id="selected-title">기본</h2>
          <p id="selected-usage">메인 화면·평상시</p>
        </div>
        <a
          id="download"
          class="download"
          href="idle.png"
          download="polar-home-idle.png"
          >이 포즈 PNG 다운로드</a
        >
      </section>
      <section aria-label="북극곰 포즈 선택">
        <p id="status" role="status">포즈를 불러오고 있어요.</p>
        <div class="grid" id="poses"></div>
      </section>
    </main>
    <script>
      (async () => {
        const status = document.getElementById('status');
        const list = document.getElementById('poses');
        try {
          const response = await fetch('manifest.json');
          if (!response.ok) throw new Error('Manifest unavailable');
          const manifest = await response.json();
          const buttons = [];
          function select(pose) {
            document.getElementById('selected-image').src = pose.file;
            document.getElementById('selected-image').alt =
              pose.label + ' 모습의 북극곰';
            document.getElementById('selected-title').textContent = pose.label;
            document.getElementById('selected-usage').textContent = pose.usage;
            const download = document.getElementById('download');
            download.href = pose.file;
            download.download = 'polar-home-' + pose.file;
            buttons.forEach((entry) =>
              entry.button.setAttribute(
                'aria-pressed',
                String(entry.key === pose.key),
              ),
            );
          }
          manifest.poses.forEach((pose) => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'pose';
            button.setAttribute('aria-pressed', String(pose.key === 'idle'));
            const image = document.createElement('img');
            image.src = pose.file;
            image.alt = '';
            image.loading = 'lazy';
            image.width = 1254;
            image.height = 1254;
            const title = document.createElement('strong');
            title.textContent = pose.label;
            const usage = document.createElement('small');
            usage.textContent = pose.usage;
            button.append(image, title, usage);
            button.addEventListener('click', () => select(pose));
            list.appendChild(button);
            buttons.push({ key: pose.key, button });
          });
          status.textContent = '배경이 투명한 개별 PNG 8종 · 1254 × 1254';
        } catch {
          status.textContent =
            '포즈를 불러오지 못했어요. 개발 서버를 실행한 상태에서 새로고침해 주세요.';
        }
      })();
    </script>
  </body>
</html>
